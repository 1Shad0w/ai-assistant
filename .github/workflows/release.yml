name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de lanzamiento (ej. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Crear GitHub Release
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.resolve_tag.outputs.tag }}
    steps:
      - name: Resolver Tag
        id: resolve_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Crear Release Inicial
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          name: Release ${{ steps.resolve_tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true

  build-cli:
    name: Compilar CLI (${{ matrix.platform.name }})
    needs: create-release
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            os: ubuntu-22.04
            bin: assistant
            archive: assistant-linux-x86_64.tar.gz
          - name: Windows x86_64
            os: windows-latest
            bin: assistant.exe
            archive: assistant-windows-x86_64.zip
          - name: macOS Apple Silicon
            os: macos-latest
            bin: assistant
            archive: assistant-macos-arm64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de Cargo
        uses: Swatinem/rust-cache@v2

      - name: Compilar binario CLI
        run: cargo build --release -p agent-runtime --bin assistant

      - name: Empaquetar artefacto (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist-cli
          cp target/release/${{ matrix.platform.bin }} dist-cli/
          cp README.md LICENSE dist-cli/
          mkdir -p dist-cli/.agents
          cp .agents/mcp_config.json dist-cli/.agents/
          tar -czvf ${{ matrix.platform.archive }} -C dist-cli .

      - name: Empaquetar artefacto (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist-cli
          cp target/release/${{ matrix.platform.bin }} dist-cli/
          cp README.md LICENSE dist-cli/
          mkdir -p dist-cli/.agents
          cp .agents/mcp_config.json dist-cli/.agents/
          7z a -tzip ${{ matrix.platform.archive }} ./dist-cli/*

      - name: Subir binario a la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: ${{ matrix.platform.archive }}

  build-desktop:
    name: Compilar Desktop GUI (${{ matrix.platform.name }})
    needs: create-release
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de Cargo
        uses: Swatinem/rust-cache@v2

      - name: Instalar dependencias del frontend
        run: |
          cd apps/desktop
          npm install

      - name: Construir y Empaquetar con Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './apps/desktop'
          tagName: ${{ needs.create-release.outputs.tag_name }}
          releaseName: 'Release ${{ needs.create-release.outputs.tag_name }}'
          releaseBody: 'Artefactos compilados automáticamente para ${{ matrix.platform.name }}.'
          releaseDraft: false
          prerelease: false
